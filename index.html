<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Prompt Generator V8.2</title>
<style>
body { background:#0f0f0f; color:#fff; font-family:Arial; padding:20px; max-width:600px; margin:auto; }
h1 { color:#00aaff; text-align:center; }
label { display:block; margin-top:15px; font-weight:bold; }
input, select, textarea, button { width:100%; padding:10px; margin-top:5px; border-radius:8px; border:1px solid #333; background:#1a1a1a; color:#fff; }
button { background:#00aaff; border:none; font-weight:bold; cursor:pointer; margin-top:20px; }
button:hover { background:#0088cc; }
#hasil-prompt { margin-top:20px; padding:15px; background:#1a1a1a; border-radius:10px; color:#00ff88; white-space:pre-wrap; border:1px solid #00aaff; }
</style>
</head>
<body>

<h1>HUMAN PROMPT GENERATOR V8.2</h1>

<label>Jenis Konten</label>
<select>
  <option>UGC Review</option>
  <option>Vlog</option>
  <option>Story Telling</option>
</select>

<label>Upload Referensi</label>
<input type="file" multiple>

<label>Deskripsi Scene</label>
<textarea placeholder="Contoh: Makan bakso panas di warung"></textarea>

<label>Lokasi</label>
<input type="text" placeholder="Contoh: Warung Bakso">

<label>Jumlah Scene</label>
<input type="number" value="3">

<label>Dialog</label>
<textarea placeholder='Contoh: Eh gila sih ini bakso'></textarea>

<button id="generate">GENERATE PROMPT</button>

<div id="hasil-prompt" style="display:none;"></div>

<script>
document.getElementById('generate').onclick = function() {
  const inputs = document.querySelectorAll('input, select, textarea');
  
  const jenis = inputs[0].value;
  const scene = inputs[1].value;
  const lokasi = inputs[2].value;
  const jumlah = inputs[3].value;
  const dialog = inputs[4].value;

  const hasil = `Buatkan ${jumlah} scene video ${jenis}.
Lokasi: ${lokasi}
Deskripsi: ${scene}
Dialog: "${dialog}"
Style: Ultra Real Anatomy, HD 8K, natural lighting, cinematic, realistic`;

  const output = document.getElementById('hasil-prompt');
  output.style.display = 'block';
  output.innerText = hasil;
}
</script>

</
